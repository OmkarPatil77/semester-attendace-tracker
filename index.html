<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semester Attendance Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            width: 360px;
        }

        h1,p {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .card {
            background: white;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
            color: #444;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #555;
        }

        input {
            width: calc(100% - 18px);
            padding: 8px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-family: 'Poppins', sans-serif;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
        }

        button:hover {
            background: #0056b3;
        }

        .summary p {
            margin: 8px 0;
            color: #555;
        }

        .summary span {
            font-weight: 600;
            color: #333;
        }

        #status {
            font-weight: bold;
            margin-top: 10px;
            font-size: 18px;
        }

        .reset {
            background: #dc3545;
        }

        .reset:hover {
            background: #c82333;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📘 Semester Attendance Tracker</h1>

    <div class="card">
        <h2>Today's Attendance</h2>

        <label>Total Lectures Today</label>
        <input type="number" id="totalToday" min="0" placeholder="Enter number">

        <label>Lectures Attended Today</label>
        <input type="number" id="attendedToday" min="0" placeholder="Enter number">

        <button onclick="addAttendance()">Add Today's Attendance</button>
    </div>

    <div class="card summary">
        <h2>Semester Summary</h2>
        <p>Total Lectures: <span id="totalLectures">0</span></p>
        <p>Attended Lectures: <span id="attendedLectures">0</span></p>
        <p>Attendance %: <span id="percentage">0</span>%</p>
        <p>Last Updated: <span id="lastUpdated">Not yet updated</span></p>
        <p id="status"></p>
    </div>

    <button class="reset" onclick="resetAttendance()">Reset for New Semester</button>

    <p>Made with &hearts; for students...!</p>
</div>

<script>
// Load stored data or initialize
let totalLectures = Number(localStorage.getItem("totalLectures")) || 0;
let attendedLectures = Number(localStorage.getItem("attendedLectures")) || 0;
let lastUpdated = localStorage.getItem("lastUpdated") || null;

updateUI();

function addAttendance() {
    const total = Number(document.getElementById("totalToday").value);
    const attended = Number(document.getElementById("attendedToday").value);

    if (total < 0 || attended < 0) {
        alert("Values cannot be negative");
        return;
    }

    if (attended > total) {
        alert("Attended lectures cannot be more than total lectures");
        return;
    }

    totalLectures += total;
    attendedLectures += attended;

    // Update last updated date
    const now = new Date();
    
    const day = String(now.getDate()).padStart(2, '0');
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const year = now.getFullYear();
    
    lastUpdated = `${day}/${month}/${year} at ${now.toLocaleTimeString([], {
    hour: '2-digit',
    minute: '2-digit'})}`;

    // Save to localStorage
    localStorage.setItem("totalLectures", totalLectures);
    localStorage.setItem("attendedLectures", attendedLectures);
    localStorage.setItem("lastUpdated", lastUpdated);

    document.getElementById("totalToday").value = "";
    document.getElementById("attendedToday").value = "";

    updateUI();
}

function updateUI() {
    document.getElementById("totalLectures").innerText = totalLectures;
    document.getElementById("attendedLectures").innerText = attendedLectures;
    document.getElementById("lastUpdated").innerText = lastUpdated || "Not yet updated";

    let percentage = totalLectures === 0
        ? 0
        : ((attendedLectures / totalLectures) * 100).toFixed(2);

    document.getElementById("percentage").innerText = percentage;

    const status = document.getElementById("status");
    if (percentage >= 50) {
        status.innerText = "Status: SAFE ✅";
        status.style.color = "green";
    } else {
        status.innerText = "Status: LOW ATTENDANCE ⚠️";
        status.style.color = "red";
    }
}

function resetAttendance() {
    if (confirm("Reset attendance for new semester?")) {
        localStorage.clear();
        totalLectures = 0;
        attendedLectures = 0;
        lastUpdated = null;
        updateUI();
    }
}
</script>

</body>
</html>
